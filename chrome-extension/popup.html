<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #333;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    .section {
      margin-bottom: 12px;
    }
    .section-label {
      font-weight: 600;
      margin-bottom: 4px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      cursor: pointer;
    }
    label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
    .status.error { color: #dc2626; }
    .status.ok { color: #16a34a; }
  </style>
</head>
<body>
  <h1>clipmind</h1>

  <div class="section">
    <div class="section-label">送り先</div>
    <label id="label-discord">
      <input type="checkbox" id="dest-discord" checked> Discord
    </label>
    <label id="label-slack">
      <input type="checkbox" id="dest-slack" checked> Slack
    </label>
  </div>

  <button id="run-btn">現在のタブを要約</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
